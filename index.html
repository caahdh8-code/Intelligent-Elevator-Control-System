// ======================================
// CONFIGURATION
// ======================================

const FIREBASE_DB_URL =
  "https://intelligent-elevator-default-rtdb.asia-southeast1.firebasedatabase.app";

const QUEUE_PATH = "Elevator/Queue";

const AI_API_URL =
  "https://intelligent-elevator-control-system-1.onrender.com/api/assistant";

let currentFloor = null;
let destinationFloor = null;
let recognition = null;
let chatHistory = [];
let pendingLiftRequest = null;
let isSendingMessage = false;
let isListening = false;
let waitingForCurrentFloor = false;

// ======================================
// HOTEL FACILITY DIRECTORY
// ======================================

const FACILITY_FLOORS = {
  "main entrance": 1,
  "entrance": 1,
  "pintu masuk": 1,
  "lobby": 1,
  "reception": 1,
  "front desk": 1,

  "standard room": 2,

  "swimming pool": 3,

// ======================================
// CURRENT FLOOR BUTTON
// ======================================

function selectCurrent(floor) {
  currentFloor = Number(floor);

  document.getElementById("currentPage").classList.add("hidden");
  document.getElementById("destinationPage").classList.remove("hidden");

  document.getElementById("currentDisplay").textContent =
    "FLOOR " + currentFloor;

  const result = document.getElementById("liftResult");
  result.classList.add("hidden");
  result.textContent = "";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateCurrentFloor(floor) {
  floor = Number(floor);

  if (![1, 2, 3].includes(floor)) return false;

  currentFloor = floor;

  const display = document.getElementById("currentDisplay");
  if (display) {
    display.textContent = "FLOOR " + floor;
  }

  return true;
}

// ======================================
// MANUAL DESTINATION BUTTON
// ======================================

async function selectDestination(floor) {
  destinationFloor = Number(floor);

  const result = document.getElementById("liftResult");
  result.classList.remove("hidden");

  if (!currentFloor) {
    result.className = "result error";
    result.textContent = "Please select your current floor first.";
    return;
  }

  if (currentFloor === destinationFloor) {
    result.className = "result error";
    result.textContent = "You are already here!";
    return;
  }

  result.className = "result";
  result.textContent = "Please wait for the lift. Sending request...";

  try {
    const queueId = await sendLiftRequest(
      currentFloor,
      destinationFloor
    );

    result.className = "result success";
    result.textContent =
      "REQUEST SUBMITTED!\n\n" +
      "Current Floor: " + currentFloor + "\n" +
      "Destination Floor: " + destinationFloor + "\n\n" +
      "Please wait for the lift.\nRequest ID: " + queueId;

  } catch (error) {
    console.error(error);
    result.className = "result error";
    result.textContent = "Unable to send request. Please try again.";
  }
}

// ======================================
// FIREBASE QUEUE
// ======================================

async function sendLiftRequest(current, destination) {
  current = Number(current);
  destination = Number(destination);

  if (
    ![1, 2, 3].includes(current) ||
    ![1, 2, 3].includes(destination)
  ) {
    throw new Error("Invalid floor selection.");
  }

  if (current === destination) {
    throw new Error("You are already here!");
  }

  const request = {
    currentFloor: current,
    destinationFloor: destination,
    status: "WAITING",
    createdAt: Date.now()
  };

  const response = await fetch(
    `${FIREBASE_DB_URL}/${QUEUE_PATH}.json`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(request)
    }
  );

  if (!response.ok) {
    throw new Error("Firebase queue error: " + response.status);
  }

  const data = await response.json();

  if (!data || !data.name) {
    throw new Error("Firebase did not return a queue ID.");
  }

  return data.name;
}

// ======================================
// BACK BUTTON
// ======================================

function backToCurrent() {
  currentFloor = null;
  destinationFloor = null;

  document.getElementById("destinationPage").classList.add("hidden");
  document.getElementById("currentPage").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ======================================
// AI WINDOW
// ======================================

function toggleAI() {
  document.getElementById("aiWindow").classList.toggle("hidden");
}

function addMessage(message, sender) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");

  div.className =
    sender === "user"
      ? "message user-message"
      : "message ai-message";

  div.textContent = String(message || "");

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ======================================
// TEXT NORMALISATION
// ======================================

function normaliseText(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function expandMalayShortform(text) {
  let t = " " + normaliseText(text) + " ";

  const replacements = [
    [/\bsy\b/g, " saya "],
    [/\bsye\b/g, " saya "],
    [/\baku\b/g, " saya "],
    [/\bko\b/g, " awak "],
    [/\bkau\b/g, " awak "],
    [/\bdye\b/g, " dia "],
    [/\bdorg\b/g, " mereka "],
    [/\bdri\b/g, " dari "],
    [/\bdr\b/g, " dari "],
    [/\bkt\b/g, " dekat "],
    [/\bdkt\b/g, " dekat "],
    [/\bkat\b/g, " dekat "],
    [/\bnk\b/g, " nak "],
    [/\bngk\b/g, " nak "],
    [/\bnek\b/g, " nak "],
    [/\bgi\b/g, " pergi "],
    [/\bg\b/g, " pergi "],
    [/\bpegi\b/g, " pergi "],
    [/\bpi\b/g, " pergi "],
    [/\bmn\b/g, " mana "],
    [/\bmaner\b/g, " mana "],
    [/\bbrp\b/g, " berapa "],
    [/\btkt\b/g, " tingkat "],
    [/\bskrg\b/g, " sekarang "],
    [/\bskang\b/g, " sekarang "],
    [/\bdh\b/g, " sudah "],
    [/\bdah\b/g, " sudah "],
    [/\bx\b/g, " tidak "],
    [/\btak\b/g, " tidak "],
    [/\btk\b/g, " tidak "],
    [/\bblm\b/g, " belum "],
    [/\bape\b/g, " apa "],
    [/\bap\b/g, " apa "],
    [/\bcamne\b/g, " bagaimana "],
    [/\bmcm\b/g, " macam "],
    [/\bcm\b/g, " macam "],
    [/\bni\b/g, " ini "],
    [/\btu\b/g, " itu "],
    [/\bje\b/g, " sahaja "],
    [/\bjer\b/g, " sahaja "],
    [/\bpon\b/g, " pun "],
    [/\bplk\b/g, " pula "],
    [/\bpls\b/g, " please "],
    [/\bplz\b/g, " please "]
  ];

  replacements.forEach(([pattern, replacement]) => {
    t = t.replace(pattern, replacement);
  });

  return t.replace(/\s+/g, " ").trim();
}

// ======================================
// CURRENT FLOOR DETECTION
// Do not mistake destination floor as current floor.
// ======================================

function detectCurrentFloor(text) {
  const t = expandMalayShortform(text);

  const patterns = [
    /\b(?:saya|awak)\s+(?:sekarang\s+)?(?:berada\s+)?(?:di|dekat|dari)\s+(?:floor|tingkat|level)?\s*(1|2|3)\b/,
    /\b(?:saya|awak)\s+(?:sekarang\s+)?(?:berada\s+)?(?:di|dekat|dari)\s+(?:floor|tingkat|level)?\s*(satu|pertama|dua|kedua|tiga|ketiga)\b/,
    /\b(?:i am|im|i)\s+(?:currently\s+)?(?:on|at|in)\s+(?:floor|level)?\s*(1|2|3)\b/,
    /\b(?:from|dari)\s+(?:floor|tingkat|level)\s*(1|2|3)\b/,
    /\b(?:current floor|my floor|tingkat saya|floor saya)\s*(?:is|ialah|adalah)?\s*(1|2|3)\b/
  ];

  const words = {
    satu: 1,
    pertama: 1,
    dua: 2,
    kedua: 2,
    tiga: 3,
    ketiga: 3
  };

  for (const pattern of patterns) {
    const match = t.match(pattern);

    if (match) {
      return words[match[1]] || Number(match[1]);
    }
  }

  // Short answer: "1", "2", "3", "floor 2".
  if (waitingForCurrentFloor) {
    const shortMatch = t.match(
      /^(?:floor|tingkat|level)?\s*(1|2|3|satu|dua|tiga|one|two|three)$/
    );

    if (shortMatch) {
      const value = shortMatch[1];

      return {
        "1": 1,
        "2": 2,
        "3": 3,
        satu: 1,
        dua: 2,
        tiga: 3,
        one: 1,
        two: 2,
        three: 3
      }[value];
    }
  }

  return null;
}

// ======================================
// CONFIRMATION DETECTION
// ======================================

function isConfirmation(text) {
  const t = expandMalayShortform(text);

  const yesWords = [
    "yes", "yeah", "yep", "y",
    "ya", "ye", "ok", "okay",
    "betul", "benar", "setuju",
    "sahkan", "confirm", "confirmed",
    "i confirm", "i agree",
    "boleh", "teruskan", "hantar",
    "terus", "haah", "haa", "aah",
    "baik", "baiklah", "sure",
    "go ahead", "do it", "jom",
    "nak", "ya boleh", "boleh hantar"
  ];

  return yesWords.includes(t);
}

function isRejection(text) {
  const t = expandMalayShortform(text);

  const noWords = [
    "no", "nope", "n",
    "cancel", "cancel it",
    "do not proceed",
    "tidak", "batal", "jangan",
    "jangan hantar", "tak setuju",
    "tidak setuju", "tak nak",
    "tidak mahu", "tak jadi",
    "dont", "stop"
  ];

  return noWords.includes(t);
}

// ======================================
// SUBMIT AI LIFT REQUEST TO FIREBASE
// ======================================

async function submitAILiftRequest(floor) {
  floor = Number(floor);

  if (!currentFloor) {
    waitingForCurrentFloor = true;

    addMessage(
      "Awak berada di tingkat berapa sekarang? Contohnya, Tingkat 2.",
      "ai"
    );

    return;
  }

  if (![1, 2, 3].includes(floor)) {
    addMessage("Maaf, tingkat destinasi tidak sah.", "ai");
    return;
  }

  if (currentFloor === floor) {
    addMessage("You are already here!", "ai");
    pendingLiftRequest = null;
    waitingForCurrentFloor = false;
    return;
  }

  try {
    const queueId = await sendLiftRequest(currentFloor, floor);

    addMessage(
      "PERMINTAAN LIF BERJAYA DIHANTAR!\n\n" +
      "Current Floor: " + currentFloor + "\n" +
      "Destination Floor: " + floor + "\n\n" +
      "Please wait for the lift.\nRequest ID: " + queueId,
      "ai"
    );

    pendingLiftRequest = null;
    waitingForCurrentFloor = false;

  } catch (error) {
    console.error("Firebase request error:", error);

    addMessage(
      "Maaf, permintaan lif tidak berjaya dihantar ke Firebase. Sila cuba lagi.\n" +
      error.message,
      "ai"
    );
  }
}

// ======================================
// SEND MESSAGE TO AI
// ======================================

async function sendMessage() {
  if (isSendingMessage) return;

  const input = document.getElementById("chatInput");
  const originalText = input.value.trim();

  if (!originalText) return;

  input.value = "";
  addMessage(originalText, "user");

  const text = expandMalayShortform(originalText);

  // --------------------------------------
  // 1. If waiting for current floor
  // --------------------------------------

  const detectedFloor = detectCurrentFloor(originalText);

  if (detectedFloor !== null) {
    updateCurrentFloor(detectedFloor);

    if (pendingLiftRequest) {
      const pending = pendingLiftRequest;

      waitingForCurrentFloor = false;

      // Direct travel: send immediately after floor is supplied.
      if (pending.type === "direct") {
        await submitAILiftRequest(pending.destinationFloor);
        return;
      }

      // Location offer: ask confirmation after floor is supplied.
      if (pending.type === "offer") {
        if (currentFloor === pending.destinationFloor) {
          addMessage("You are already here!", "ai");
          pendingLiftRequest = null;
          return;
        }

        addMessage(
          "Baik, awak sekarang di Tingkat " + currentFloor +
          ". " + (pending.facility || "Destinasi tersebut") +
          " berada di Tingkat " + pending.destinationFloor +
          ". Nak saya hantar permintaan lif ke sana? Balas YES atau NO.",
          "ai"
        );

        return;
      }
    }
  }

  // --------------------------------------
  // 2. Handle YES / confirmation
  // --------------------------------------

  if (pendingLiftRequest && isConfirmation(text)) {
    const pending = pendingLiftRequest;

    if (!currentFloor) {
      waitingForCurrentFloor = true;

      addMessage(
        "Boleh. Sebelum saya hantar, awak berada di tingkat berapa sekarang?",
        "ai"
      );

      return;
    }

    await submitAILiftRequest(pending.destinationFloor);
    return;
  }

  // --------------------------------------
  // 3. Handle NO / cancellation
  // --------------------------------------

  if (pendingLiftRequest && isRejection(text)) {
    pendingLiftRequest = null;
    waitingForCurrentFloor = false;

    addMessage(
      "Okay, permintaan lif dibatalkan. Ada apa-apa lagi yang boleh saya bantu?",
      "ai"
    );

    return;
  }

  // --------------------------------------
  // 4. Send message to backend
  // --------------------------------------

  const chatBox = document.getElementById("chatBox");

  const thinking = document.createElement("div");
  thinking.className = "message ai-message";
  thinking.textContent = "AI is thinking...";

  chatBox.appendChild(thinking);
  chatBox.scrollTop = chatBox.scrollHeight;

  isSendingMessage = true;

  const sendButton = document.getElementById("sendButton");
  if (sendButton) sendButton.disabled = true;

  try {
    const response = await fetch(AI_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: originalText,
        currentFloor: currentFloor,
        history: chatHistory
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("The AI server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(
        data.details || data.error || "AI server error"
      );
    }

    thinking.remove();

    const reply = data.reply || data.response || data.answer;

    if (typeof reply !== "string") {
      throw new Error("Invalid AI response.");
    }

    // Keep conversation history for normal AI chat.
    chatHistory.push({
      role: "user",
      content: originalText
    });

    chatHistory.push({
      role: "assistant",
      content: reply
    });

    chatHistory = chatHistory.slice(-10);

    // Update current floor if backend detected it.
    if (
      data.currentFloor &&
      [1, 2, 3].includes(Number(data.currentFloor))
    ) {
      updateCurrentFloor(Number(data.currentFloor));
    }

    // --------------------------------------
    // 5. DIRECT SEND TO FIREBASE
    // --------------------------------------

    if (data.action === "send_lift") {
      const fromFloor = Number(data.currentFloor || currentFloor);
      const toFloor = Number(data.destinationFloor);

      if (![1, 2, 3].includes(fromFloor)) {
        addMessage(
          "Saya perlu tahu tingkat semasa awak sebelum menghantar permintaan lif.",
          "ai"
        );

        pendingLiftRequest = {
          type: "direct",
          destinationFloor: toFloor,
          facility: data.facility || ""
        };

        waitingForCurrentFloor = true;
        return;
      }

      updateCurrentFloor(fromFloor);

      if (![1, 2, 3].includes(toFloor)) {
        addMessage("Maaf, tingkat destinasi tidak sah.", "ai");
        return;
      }

      if (fromFloor === toFloor) {
        addMessage("You are already here!", "ai");
        return;
      }

      addMessage(reply, "ai");

      await submitAILiftRequest(toFloor);
      return;
    }

    // --------------------------------------
    // 6. BACKEND ASKS FOR CURRENT FLOOR
    // --------------------------------------

    if (data.action === "ask_current_floor") {
      pendingLiftRequest = {
        type: "direct",
        destinationFloor: Number(data.destinationFloor),
        facility: data.facility || ""
      };

      waitingForCurrentFloor = true;
      addMessage(reply, "ai");
      return;
    }

    // --------------------------------------
    // 7. LOCATION QUESTION / OFFER
    // --------------------------------------

    if (data.action === "offer_lift") {
      pendingLiftRequest = {
        type: "offer",
        destinationFloor: Number(data.destinationFloor),
        facility: data.facility || ""
      };

      waitingForCurrentFloor = false;
      addMessage(reply, "ai");
      return;
    }

    // --------------------------------------
    // 8. NORMAL AI RESPONSE
    // --------------------------------------

    addMessage(reply, "ai");

  } catch (error) {
    thinking.remove();

    console.error("AI error:", error);

    addMessage(
      "Sorry, the AI Assistant is temporarily unavailable. Please try again.\n\n" +
      error.message,
      "ai"
    );

  } finally {
    isSendingMessage = false;

    if (sendButton) {
      sendButton.disabled = false;
    }
  }
}

// ======================================
// VOICE INPUT
// ======================================

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status = document.getElementById("voiceStatus");
  const voiceButton = document.getElementById("voiceButton");

  const selectedLanguage =
    document.getElementById("voiceLanguage").value;

  if (!SpeechRecognition) {
    status.textContent =
      "Voice recognition is not supported in this browser. Please use Chrome.";
    return;
  }

  if (isListening) {
    status.textContent = "Voice recognition is already active.";
    return;
  }

  if (recognition) {
    recognition.onend = null;

    try {
      recognition.stop();
    } catch (error) {
      console.log(error);
    }
  }

  recognition = new SpeechRecognition();

  recognition.lang = selectedLanguage;
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  isListening = true;

  voiceButton.classList.add("recording");
  voiceButton.textContent = "🔴 LISTENING...";

  status.textContent =
    selectedLanguage === "ms-MY"
      ? "Mendengar... Sila bercakap sekarang."
      : "Listening... Please speak now.";

  recognition.onresult = function(event) {
    let finalTranscript = "";
    let interimTranscript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }

    if (interimTranscript) {
      status.textContent = "Recognising: " + interimTranscript;
    }

    if (finalTranscript.trim()) {
      document.getElementById("chatInput").value =
        finalTranscript.trim();

      status.textContent =
        "Voice captured. Sending to AI...";

      sendMessage();
    }
  };

  recognition.onerror = function(event) {
    status.textContent = "Voice error: " + event.error;
  };

  recognition.onend = function() {
    isListening = false;

    voiceButton.classList.remove("recording");
    voiceButton.textContent = "🎤 START VOICE";

    if (
      status.textContent.includes("Listening") ||
      status.textContent.includes("Mendengar")
    ) {
      status.textContent = "Voice recognition stopped.";
    }
  };

  try {
    recognition.start();
  } catch (error) {
    isListening = false;

    voiceButton.classList.remove("recording");
    voiceButton.textContent = "🎤 START VOICE";

    status.textContent =
      "Unable to start microphone. Please try again.";
  }
}

// ======================================
// STOP VOICE
// ======================================

function stopVoice() {
  if (recognition && isListening) {
    recognition.stop();
  }

  isListening = false;

  const voiceButton = document.getElementById("voiceButton");
  const status = document.getElementById("voiceStatus");

  voiceButton.classList.remove("recording");
  voiceButton.textContent = "🎤 START VOICE";

  status.textContent = "Voice recognition stopped.";
}
</script>
