<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244879">
  <title>Intelligent Elevator Control System</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: #17202b;
      background: #f1f5fa;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 24px;
      background: #edf3fb;
      border-radius: 30px;
    }

    .header {
      padding: 34px 20px;
      text-align: center;
      color: white;
      background: #244879;
      border-radius: 25px;
      box-shadow: 0 8px 22px #17477f20;
      animation: fadeIn .5s ease;
    }

    .lift-icon {
      margin-bottom: 12px;
      font-size: 38px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
      line-height: 1.3;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #dce8fb;
      font-size: clamp(16px, 3vw, 22px);
    }

    .tagline {
      margin: 17px 0 0;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .panel {
      margin-top: 24px;
      padding: 30px;
      background: white;
      border-radius: 25px;
      animation: fadeIn .35s ease;
    }

    .step {
      margin-bottom: 12px;
      color: #6482a5;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.3px;
    }

    .question {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 26px;
      font-size: clamp(23px, 4vw, 32px);
    }

    .question-icon {
      color: #4285c5;
      font-size: 28px;
    }

    .floor-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .floor-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 104px;
      padding: 16px;
      gap: 24px;
      text-align: left;
      color: #18212b;
      background: #f8fafc;
      border: 2px solid #dce5f0;
      border-radius: 22px;
      cursor: pointer;
      transition: transform .18s, border-color .18s, background .18s;
    }

    .floor-button:hover:not(:disabled) {
      border-color: #4285c5;
      background: #f0f6ff;
      transform: translateY(-2px);
    }

    .floor-button:active:not(:disabled) {
      transform: scale(.99);
    }

    .floor-number {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 76px;
      height: 76px;
      color: #244879;
      background: #e6edf7;
      border-radius: 18px;
      font-size: 34px;
      font-weight: bold;
    }

    .floor-text { flex: 1; }

    .floor-name {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .floor-hint {
      display: block;
      margin-top: 8px;
      color: #718198;
      font-size: 15px;
    }

    .floor-arrow {
      color: #8396ad;
      font-size: 34px;
    }

    .floor-button:disabled {
      cursor: not-allowed;
      opacity: .7;
      background: #f0f2f5;
      border-color: #e1e5eb;
    }

    .floor-button:disabled .floor-number {
      color: #7c8997;
      background: #e1e5eb;
    }

    .hidden { display: none !important; }

    #message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message:empty { display: none; }

    .message-info {
      color: #17477f;
      background: #edf5ff;
    }

    .message-success {
      color: #176a39;
      background: #e7f7ed;
    }

    .message-error {
      color: #a62424;
      background: #fff0ef;
    }

    .action-button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      color: #244879;
      background: #e6edf7;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-button:hover { background: #d8e7fa; }

    .footer {
      margin-top: 24px;
      color: #718198;
      text-align: center;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .app { padding: 14px; border-radius: 23px; }
      .header { padding: 27px 14px; border-radius: 19px; }
      .panel { padding: 22px 16px; border-radius: 20px; }

      .floor-button {
        min-height: 85px;
        padding: 12px;
        gap: 14px;
        border-radius: 17px;
      }

      .floor-number {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        font-size: 28px;
      }

      .floor-name { font-size: 18px; }
      .floor-hint { font-size: 12px; }
      .floor-arrow { font-size: 27px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="lift-icon" aria-hidden="true">⇅</div>
      <h1>Intelligent Elevator<br>Control System</h1>
      <p class="subtitle">NFC-Based Web Elevator Control</p>
      <p class="tagline">SMART · SIMPLE · CONTACTLESS</p>
    </header>

    <main class="panel">

      <section id="currentSection">
        <div class="step">STEP 1 OF 2</div>

        <h2 class="question">
          <span class="question-icon">⌖</span>
          Where are you?
        </h2>

        <div class="floor-list" id="currentFloors"></div>
      </section>

      <section id="destinationSection" class="hidden">
        <div class="step">STEP 2 OF 2</div>

        <h2 class="question">
          <span class="question-icon">↗</span>
          Where to?
        </h2>

        <div class="floor-list" id="destinationFloors"></div>

        <button type="button" class="action-button" id="backButton">
          ← Change Current Floor
        </button>
      </section>

      <div id="message" role="status" aria-live="polite"></div>

      <button type="button" class="action-button hidden" id="againButton">
        Make Another Request
      </button>

    </main>

    <footer class="footer">
      Intelligent Elevator Control System · 3-Floor Prototype
    </footer>

  </div>

  <script>
    // Firebase project: intelligent-elevator
    const firebaseConfig = {
      apiKey: "AIzaSyYBBoZbKfdZTy8u04v62QhdJpwFFH64mH6o",
      authDomain: "intelligent-elevator.firebaseapp.com",
      databaseURL: "https://intelligent-elevator-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "intelligent-elevator",
      storageBucket: "intelligent-elevator.firebasestorage.app",
      messagingSenderId: "316169158322",
      appId: "1:316169158322:web:2da1676075b7a51150d3ab",
      measurementId: "G-F2SW86Y9FF"
    };

    const currentSection = document.getElementById("currentSection");
    const destinationSection = document.getElementById("destinationSection");
    const currentFloors = document.getElementById("currentFloors");
    const destinationFloors = document.getElementById("destinationFloors");
    const message = document.getElementById("message");
    const backButton = document.getElementById("backButton");
    const againButton = document.getElementById("againButton");

    let db = null;
    let currentFloor = null;
    let sending = false;

    let sessionId = sessionStorage.getItem("elevatorSessionId");

    if (!sessionId) {
      sessionId = window.crypto && crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "-" + Math.random().toString(36).slice(2);

      sessionStorage.setItem("elevatorSessionId", sessionId);
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    function createFloorButton(floor, hint, callback, disabled = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "floor-button";
      button.disabled = disabled;

      const number = document.createElement("span");
      number.className = "floor-number";
      number.textContent = floor;

      const text = document.createElement("span");
      text.className = "floor-text";

      const name = document.createElement("span");
      name.className = "floor-name";
      name.textContent = "Floor " + floor;

      const detail = document.createElement("span");
      detail.className = "floor-hint";
      detail.textContent = hint;

      const arrow = document.createElement("span");
      arrow.className = "floor-arrow";
      arrow.textContent = disabled ? "✓" : "›";

      text.append(name, detail);
      button.append(number, text, arrow);

      if (!disabled) {
        button.addEventListener("click", callback);
      }

      return button;
    }

    // Step 1: select current floor
    function renderCurrentFloors() {
      currentFloors.replaceChildren();

      [1, 2, 3].forEach(floor => {
        currentFloors.appendChild(
          createFloorButton(floor, "Tap to select", function () {
            currentFloor = floor;
            currentSection.classList.add("hidden");
            destinationSection.classList.remove("hidden");

            clearMessage();
            renderDestinationFloors();
          })
        );
      });
    }

    // Step 2: select destination floor
    function renderDestinationFloors() {
      destinationFloors.replaceChildren();

      [1, 2, 3].forEach(floor => {
        const sameFloor = floor === currentFloor;

        destinationFloors.appendChild(
          createFloorButton(
            floor,
            sameFloor ? "You are already here!" : "Tap to select",
            function () {
              submitRequest(floor);
            },
            sameFloor
          )
        );
      });
    }

    // Save each request using a unique Firebase key
    async function submitRequest(destinationFloor) {
      if (sending) return;

      if (destinationFloor === currentFloor) {
        showMessage("You are already here!", "message-error");
        return;
      }

      if (!db) {
        showMessage("Firebase is not connected.", "message-error");
        return;
      }

      sending = true;

      destinationFloors.querySelectorAll("button").forEach(button => {
        button.disabled = true;
      });

      showMessage("Sending request...", "message-info");

      try {
        const requestRef = db.ref("Requests").push();

        await requestRef.set({
          pickupFloor: currentFloor,
          destinationFloor: destinationFloor,
          status: "WAITING",
          sessionId: sessionId,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        });

        currentSection.classList.add("hidden");
        destinationSection.classList.add("hidden");
        backButton.classList.add("hidden");

        showMessage("Request sent successfully!", "message-success");
        againButton.classList.remove("hidden");

      } catch (error) {
        console.error("Firebase error:", error);

        showMessage(
          "Request failed. Check Firebase Rules and connection.",
          "message-error"
        );

        renderDestinationFloors();

      } finally {
        sending = false;
      }
    }

    backButton.addEventListener("click", function () {
      if (sending) return;

      currentFloor = null;

      destinationSection.classList.add("hidden");
      currentSection.classList.remove("hidden");

      clearMessage();
      renderCurrentFloors();
    });

    againButton.addEventListener("click", function () {
      if (sending) return;

      currentFloor = null;

      currentSection.classList.remove("hidden");
      destinationSection.classList.add("hidden");

      backButton.classList.remove("hidden");
      againButton.classList.add("hidden");

      clearMessage();
      renderCurrentFloors();
    });

    renderCurrentFloors();

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (error) {
      console.error(error);
      showMessage("Firebase configuration error.", "message-error");
    }
  </script>
</body>
</html>
